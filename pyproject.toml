[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neural-ofdm"
version = "0.1.0"
description = "An explicit, tested classical SISO OFDM baseline for neural receiver research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
neural = ["torch==2.9.1"]

[tool.uv]
exclude-newer = "2026-09-02T22:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["jupyterlab>=4.3,<5", "pytest>=8.3,<10", "ruff>=0.9,<1", "nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6.29,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_ofdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python", ".runtime", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
